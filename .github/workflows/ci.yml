name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only to publish test evidence to the ci-evidence branch

jobs:
  engine:
    name: Engine tests (Windows, real converters)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install converters
        shell: pwsh
        run: |
          choco install -y --no-progress ffmpeg pandoc ghostscript libreoffice-fresh
          $gs = Get-ChildItem 'C:\Program Files\gs' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          "$($gs.FullName)\bin" | Out-File -Append $env:GITHUB_PATH
          'C:\Program Files\LibreOffice\program' | Out-File -Append $env:GITHUB_PATH
      - name: Test
        shell: pwsh
        env:
          ORANGE_REQUIRE_TOOLS: '1'
        run: |
          dotnet run --project src/Orange.Cli -c Release -- tools
          dotnet test tests/Orange.Core.Tests -c Release --logger "trx;LogFileName=engine.trx" --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath engine-test.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Operation matrix
        if: always()
        shell: pwsh
        run: dotnet run --project src/Orange.Cli -c Release -- matrix | Tee-Object -FilePath operation-matrix.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-results
          path: |
            engine-test.log
            operation-matrix.md
            tests/**/TestResults/*.trx

      - name: Publish engine evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force engine-evidence | Out-Null
          if (Test-Path engine-test.log) { Select-String -Path engine-test.log -Pattern 'Failed |Error Message|Assert|Skipped |Passed!|Failed!|Total tests' -Context 0,6 | ForEach-Object { $_.Line; $_.Context.PostContext } | Select-Object -First 400 | Out-File engine-evidence/failures.txt }
          Copy-Item operation-matrix.md engine-evidence/ -ErrorAction SilentlyContinue
          $url = "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git"
          for ($i = 0; $i -lt 5; $i++) {
            $repo = "$env:RUNNER_TEMP\evrepo$i"
            git clone -q --depth 1 -b ci-evidence $url $repo 2>$null
            if (-not (Test-Path "$repo\.git")) { git init -q -b ci-evidence $repo; git -C $repo remote add origin $url }
            $dest = "$repo\run-${{ github.run_number }}\engine"; New-Item -ItemType Directory -Force $dest | Out-Null
            Copy-Item engine-evidence\* $dest -Force
            git -C $repo config user.name "orange-ci"; git -C $repo config user.email "orange-ci@users.noreply.github.com"
            git -C $repo add -A; git -C $repo commit -qm "engine evidence ${{ github.run_number }}"
            git -C $repo push -q origin HEAD:ci-evidence 2>$null
            if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 5
          }

  app:
    name: Windows app (build, self-test, real drag probe, package)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HAS_CERT: ${{ secrets.SIGNING_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install converters for the self-test
        shell: pwsh
        run: |
          choco install -y --no-progress ffmpeg pandoc ghostscript
          $gs = Get-ChildItem 'C:\Program Files\gs' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          "$($gs.FullName)\bin" | Out-File -Append $env:GITHUB_PATH
      - name: Build and publish Orange (x64, self-contained, unpackaged)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          dotnet publish src/Orange.App/Orange.App.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained -o out/Orange 2>&1 | Tee-Object -FilePath evidence/app-build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem out/Orange | Select-Object -First 15 | Format-Table Name, Length | Out-String | Write-Host
      - name: Bundle FFmpeg and Pandoc (separate GPL programs, with their licenses)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $t = "out/Orange/tools"; New-Item -ItemType Directory -Force "$t/ffmpeg/bin","$t/pandoc" | Out-Null
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ffx; $d = Get-ChildItem ffx -Directory | Select-Object -First 1
          Copy-Item "$($d.FullName)/bin/ffmpeg.exe","$($d.FullName)/bin/ffprobe.exe" "$t/ffmpeg/bin/"; Copy-Item "$($d.FullName)/LICENSE.txt" "$t/ffmpeg/LICENSE.txt"
          "Source: https://github.com/BtbN/FFmpeg-Builds (build scripts) and https://ffmpeg.org/download.html (source code)" | Out-File "$t/ffmpeg/SOURCE.txt"
          $rel = gh release view -R jgm/pandoc --json assets,tagName | ConvertFrom-Json
          $a = $rel.assets | Where-Object { $_.name -like '*windows-x86_64.zip' } | Select-Object -First 1
          Invoke-WebRequest $a.url -OutFile pd.zip; Expand-Archive pd.zip pdx
          $pe = Get-ChildItem pdx -Recurse -Filter pandoc.exe | Select-Object -First 1
          Copy-Item $pe.FullName "$t/pandoc/"; Get-ChildItem $pe.Directory -Filter 'COPYING*' | Copy-Item -Destination "$t/pandoc/"
          "Pandoc $($rel.tagName). Source: https://github.com/jgm/pandoc" | Out-File "$t/pandoc/SOURCE.txt"
      - name: UI feature bisect
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          Get-ChildItem out/Orange -Recurse -Filter *.pri | ForEach-Object { "pri: $($_.FullName) $($_.Length)" } | Tee-Object -Append evidence/summary.txt
          foreach ($v in 'plain','bar','nav','combo','number','toggle','infobar','textbox','list','ring','orangebar','full') {
            $p = Start-Process out/Orange/Orange.exe -ArgumentList '--uitest', $v -PassThru
            if (-not $p.WaitForExit(20000)) { $p.Kill(); $code = 'timeout' } else { $code = $p.ExitCode }
            "uitest $v exit=$code" | Tee-Object -Append evidence/summary.txt
          }
      - name: Self-test (real Windows APIs, in-process)
        shell: pwsh
        env:
          ORANGE_FIXTURES: ${{ github.workspace }}\tests\fixtures
        run: |
          New-Item -ItemType Directory -Force evidence/selftest | Out-Null
          $env:ORANGE_TEST_EVENTS = "$PWD\evidence\selftest\events.log"
          $p = Start-Process out/Orange/Orange.exe -ArgumentList '--selftest', "$PWD\evidence\selftest" -PassThru -Wait
          Get-Content evidence/selftest/selftest.json -ErrorAction SilentlyContinue | Write-Host
          "selftest exit=$($p.ExitCode)" | Tee-Object -Append evidence/summary.txt
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in 'Application Error','.NET Runtime','Windows Error Reporting' } |
            Select-Object -First 12 | ForEach-Object { "[$($_.TimeCreated)] $($_.ProviderName)`n$($_.Message)`n" } | Out-File evidence/selftest/windows-events.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Real drag probe (SendInput + OLE + File Explorer)
        if: always()
        shell: pwsh
        run: |
          dotnet build tests/Orange.DragProbe -c Release -o out/probe 2>&1 | Out-File evidence/probe-build.log
          $p = Start-Process out/probe/Orange.DragProbe.exe -ArgumentList "$PWD\out\Orange\Orange.exe", "$PWD\tests\fixtures", "$PWD\evidence\probe" -PassThru -Wait
          Get-Content evidence/probe/probe.json -ErrorAction SilentlyContinue | Write-Host
          Copy-Item "$env:LOCALAPPDATA\Orange\crash.log" evidence/ -ErrorAction SilentlyContinue
          "probe exit=$($p.ExitCode)" | Tee-Object -Append evidence/summary.txt
      - name: Package (portable zip + per-user installer)
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md out/Orange/ -ErrorAction SilentlyContinue
          Compress-Archive out/Orange/* out/Orange-0.1.0-win-x64-portable.zip -Force
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.1.0 installer/Orange.iss 2>&1 | Tee-Object evidence/installer.log
          Get-ChildItem out/*.zip, out/*.exe | Format-Table Name, Length | Out-String | Tee-Object -Append evidence/summary.txt
      - name: Optional code signing
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          SIGN_CERT: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGN_PASS: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:SIGN_CERT))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -like '*x64*' | Select-Object -Last 1
          & $st.FullName sign /f cert.pfx /p $env:SIGN_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 out/Orange/Orange.exe out/*.exe
          Remove-Item cert.pfx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orange-win-x64
          path: |
            out/Orange-*-portable.zip
            out/Orange-*-setup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-evidence
          path: evidence
      - name: Publish evidence to ci-evidence branch
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = "evidence/app-build.log"
          if (Test-Path $log) { Select-String -Path $log -Pattern 'error|warn' | Select-Object -First 200 | ForEach-Object Line | Out-File evidence/app-build-errors.txt }
          Get-ChildItem evidence -Recurse -Directory | Where-Object { $_.Name -in 'work','a','explorer-source' } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          $repo = "$env:RUNNER_TEMP\evrepo"
          $url = "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 -b ci-evidence $url $repo 2>$null
          if (-not (Test-Path "$repo\.git")) { git init -q -b ci-evidence $repo; git -C $repo remote add origin $url }
          $dest = "$repo\run-${{ github.run_number }}"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item evidence\* $dest -Recurse -Force
          Get-ChildItem $dest -Recurse -Include *.log | Where-Object Length -gt 900KB | ForEach-Object { $t = Get-Content $_ -Tail 4000; Set-Content $_ $t }
          git -C $repo config user.name "orange-ci"; git -C $repo config user.email "orange-ci@users.noreply.github.com"
          git -C $repo add -A
          git -C $repo commit -qm "evidence for run ${{ github.run_number }} (${{ github.sha }})"
          git -C $repo push -q origin HEAD:ci-evidence
          if ($LASTEXITCODE -ne 0) { git -C $repo pull -q --rebase origin ci-evidence; git -C $repo push -q origin HEAD:ci-evidence }
      - name: Publish nightly pre-release (installer + portable)
        if: success() && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nightly -R ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create nightly -R ${{ github.repository }} --prerelease --title "Orange nightly" --notes "Unsigned development build from main. See README for what's verified." }
          gh release upload nightly -R ${{ github.repository }} (Get-ChildItem out/Orange-*-portable.zip).FullName (Get-ChildItem out/Orange-*-setup.exe).FullName --clobber
          gh release edit nightly -R ${{ github.repository }} --notes "Unsigned development build of ${{ github.sha }} (run ${{ github.run_number }}). Windows 10 1809+/11 x64. SmartScreen will warn because it's unsigned."
