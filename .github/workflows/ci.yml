name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only to publish test evidence to the ci-evidence branch

jobs:
  engine:
    name: Engine tests (Windows, real converters)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install converters
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $ErrorActionPreference = 'Continue'
          foreach ($try in 1,2) {
            choco install -y --no-progress ffmpeg pandoc ghostscript libreoffice-fresh 2>&1 | Out-File -Append evidence/install.log
            if ($LASTEXITCODE -eq 0) { break }
            "choco attempt $try exit=$LASTEXITCODE" | Tee-Object -Append evidence/install.log
          }
          if (-not (Get-Command pandoc -ErrorAction SilentlyContinue) -and -not (Test-Path 'C:\Program Files\Pandoc\pandoc.exe')) {
            # choco's pandoc package flakes on hosted runners; fall back to the official release zip
            $rel = gh release view -R jgm/pandoc --json assets | ConvertFrom-Json
            $a = $rel.assets | Where-Object { $_.name -like '*windows-x86_64.zip' } | Select-Object -First 1
            Invoke-WebRequest $a.url -OutFile "$env:RUNNER_TEMP\pd.zip"; Expand-Archive "$env:RUNNER_TEMP\pd.zip" "$env:RUNNER_TEMP\pd" -Force
            (Get-ChildItem "$env:RUNNER_TEMP\pd" -Recurse -Filter pandoc.exe | Select-Object -First 1).Directory.FullName | Out-File -Append $env:GITHUB_PATH
          }
          $gs = Get-ChildItem 'C:\Program Files\gs' -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if ($gs) { "$($gs.FullName)\bin" | Out-File -Append $env:GITHUB_PATH } else { "ghostscript missing" | Tee-Object -Append evidence/install.log }
          'C:\Program Files\LibreOffice\program' | Out-File -Append $env:GITHUB_PATH
          exit 0
      - name: Test
        shell: pwsh
        env:
          ORANGE_REQUIRE_TOOLS: '1'
        run: |
          dotnet run --project src/Orange.Cli -c Release -- tools
          dotnet test tests/Orange.Core.Tests -c Release --logger "trx;LogFileName=engine.trx" --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath engine-test.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Operation matrix
        if: always()
        shell: pwsh
        run: dotnet run --project src/Orange.Cli -c Release -- matrix | Tee-Object -FilePath operation-matrix.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-results
          path: |
            engine-test.log
            operation-matrix.md
            tests/**/TestResults/*.trx

      - name: Publish engine evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force engine-evidence | Out-Null
          if (Test-Path engine-test.log) { Select-String -Path engine-test.log -Pattern 'Failed |Error Message|Assert|Skipped |Passed!|Failed!|Total tests' -Context 0,6 | ForEach-Object { $_.Line; $_.Context.PostContext } | Select-Object -First 400 | Out-File engine-evidence/failures.txt }
          Copy-Item operation-matrix.md engine-evidence/ -ErrorAction SilentlyContinue
          Copy-Item evidence/install.log engine-evidence/ -ErrorAction SilentlyContinue
          $url = "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git"
          for ($i = 0; $i -lt 5; $i++) {
            $repo = "$env:RUNNER_TEMP\evrepo$i"
            git clone -q --depth 1 -b ci-evidence $url $repo 2>$null
            if (-not (Test-Path "$repo\.git")) { git init -q -b ci-evidence $repo; git -C $repo remote add origin $url }
            $dest = "$repo\run-${{ github.run_number }}\engine"; New-Item -ItemType Directory -Force $dest | Out-Null
            Copy-Item engine-evidence\* $dest -Force
            git -C $repo config user.name "orange-ci"; git -C $repo config user.email "orange-ci@users.noreply.github.com"
            git -C $repo add -A; git -C $repo commit -qm "engine evidence ${{ github.run_number }}"
            git -C $repo push -q origin HEAD:ci-evidence 2>$null
            if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 5
          }

  app:
    name: Windows app (build, self-test, real drag probe, package)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Signing is optional: with no secrets every signing step reports "skipped" and the build stays green.
      SIGN_CERT: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
      SIGN_PASS: ${{ secrets.SIGNING_CERT_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      TS_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      TS_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      TS_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install converters for the self-test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $ErrorActionPreference = 'Continue'
          foreach ($try in 1,2) {
            choco install -y --no-progress ffmpeg pandoc ghostscript 2>&1 | Out-File -Append evidence/install.log
            if ($LASTEXITCODE -eq 0) { break }
            "choco attempt $try exit=$LASTEXITCODE" | Tee-Object -Append evidence/install.log
          }
          if (-not (Get-Command pandoc -ErrorAction SilentlyContinue) -and -not (Test-Path 'C:\Program Files\Pandoc\pandoc.exe')) {
            # choco's pandoc package flakes on hosted runners; fall back to the official release zip
            $rel = gh release view -R jgm/pandoc --json assets | ConvertFrom-Json
            $a = $rel.assets | Where-Object { $_.name -like '*windows-x86_64.zip' } | Select-Object -First 1
            Invoke-WebRequest $a.url -OutFile "$env:RUNNER_TEMP\pd.zip"; Expand-Archive "$env:RUNNER_TEMP\pd.zip" "$env:RUNNER_TEMP\pd" -Force
            (Get-ChildItem "$env:RUNNER_TEMP\pd" -Recurse -Filter pandoc.exe | Select-Object -First 1).Directory.FullName | Out-File -Append $env:GITHUB_PATH
          }
          $gs = Get-ChildItem 'C:\Program Files\gs' -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if ($gs) { "$($gs.FullName)\bin" | Out-File -Append $env:GITHUB_PATH } else { "ghostscript missing" | Tee-Object -Append evidence/install.log }

          exit 0
      - name: Build and publish Orange (x64, self-contained, unpackaged)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          dotnet publish src/Orange.App/Orange.App.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained -o out/Orange 2>&1 | Tee-Object -FilePath evidence/app-build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem out/Orange | Select-Object -First 15 | Format-Table Name, Length | Out-String | Write-Host
      - name: Publish the CLI beside the app (shares its runtime files)
        shell: pwsh
        run: |
          dotnet publish src/Orange.Cli/Orange.Cli.csproj -c Release -r win-x64 --self-contained -o out/Orange 2>&1 | Tee-Object -Append evidence/app-build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force out/Orange/cli | Out-Null
          Copy-Item installer/cli/orange.cmd out/Orange/cli/
          & out/Orange/orange-cli.exe --version | Tee-Object -Append evidence/summary.txt
          & out/Orange/orange-cli.exe presets list | Tee-Object -Append evidence/cli-presets.txt
          & out/Orange/orange-cli.exe convert tests/fixtures/sample.png --to webp -o $env:RUNNER_TEMP --json | Tee-Object evidence/cli-convert.json
          "cli convert exit=$LASTEXITCODE" | Tee-Object -Append evidence/summary.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Bundle 7-Zip (7z.exe + 7z.dll, LGPL with unRAR restriction) and drop unused Windows ML binaries
        shell: pwsh
        run: |
          $src = "$env:ProgramFiles\7-Zip"
          if (-not (Test-Path "$src\7z.exe")) { choco install -y --no-progress 7zip | Out-Null }
          New-Item -ItemType Directory -Force out/Orange/tools/7zip | Out-Null
          Copy-Item "$src\7z.exe","$src\7z.dll","$src\License.txt" out/Orange/tools/7zip/
          "7-Zip $((Get-Item "$src\7z.exe").VersionInfo.ProductVersion). Source: https://www.7-zip.org (LGPL-2.1; unRAR code under the unRAR licence restriction)" | Out-File out/Orange/tools/7zip/SOURCE.txt
          # Windows App SDK 1.8 ships ONNX Runtime + DirectML for Windows ML; Orange doesn't use Windows ML (~38 MB).
          Remove-Item out/Orange/onnxruntime.dll, out/Orange/DirectML.dll -ErrorAction SilentlyContinue
          Remove-Item out/Orange/NpuDetect -Recurse -ErrorAction SilentlyContinue
      - name: Build the Windows 11 context-menu extension (IExplorerCommand DLL + sparse MSIX)
        shell: pwsh
        env:
          SIGN_SUBJECT: ${{ secrets.SIGNING_CERT_SUBJECT }}
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          New-Item -ItemType Directory -Force out/shellext | Out-Null
          cmd /c "`"$vcvars`" >nul && cl /nologo /O2 /EHsc /std:c++17 /DUNICODE /D_UNICODE /LD src\Orange.ShellExt\OrangeShellExt.cpp /Feout\shellext\OrangeShellExt.dll /link /DEF:src\Orange.ShellExt\OrangeShellExt.def" 2>&1 | Tee-Object evidence/shellext-build.log
          if (-not (Test-Path out/shellext/OrangeShellExt.dll)) { Write-Host "shell extension build failed"; exit 1 }
          Copy-Item out/shellext/OrangeShellExt.dll out/Orange/
          $stage = "out/msix"; New-Item -ItemType Directory -Force "$stage/Assets" | Out-Null
          $manifest = Get-Content src/Orange.ShellExt/AppxManifest.xml -Raw
          if ($env:SIGN_SUBJECT) { $manifest = $manifest.Replace('Publisher="CN=Orange contributors"', "Publisher=`"$env:SIGN_SUBJECT`"") }
          Set-Content "$stage/AppxManifest.xml" $manifest -Encoding UTF8
          Copy-Item src/Orange.ShellExt/orange-150.png, src/Orange.ShellExt/orange-44.png "$stage/Assets/"
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe | Where-Object FullName -like '*x64*' | Select-Object -Last 1
          & $makeappx.FullName pack /o /d $stage /p out/Orange/Orange-ContextMenu.msix /nv 2>&1 | Tee-Object -Append evidence/shellext-build.log
          if (-not (Test-Path out/Orange/Orange-ContextMenu.msix)) { Write-Host "MSIX pack failed"; exit 1 }
          "shell extension dll=$((Get-Item out/Orange/OrangeShellExt.dll).Length) msix=$((Get-Item out/Orange/Orange-ContextMenu.msix).Length)" | Tee-Object -Append evidence/summary.txt
      - name: Bundle FFmpeg (LGPL shared build, licence + source offer)
        shell: pwsh
        run: |
          $t = "out/Orange/tools"; New-Item -ItemType Directory -Force "$t/ffmpeg/bin" | Out-Null
          $zip = "ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$zip" -OutFile ff.zip
          Expand-Archive ff.zip ffx; $d = Get-ChildItem ffx -Directory | Select-Object -First 1
          Get-ChildItem "$($d.FullName)/bin" | Where-Object { $_.Name -ne 'ffplay.exe' } | Copy-Item -Destination "$t/ffmpeg/bin/"
          Copy-Item "$($d.FullName)/LICENSE.txt" "$t/ffmpeg/LICENSE.txt"
          Copy-Item tools/ffmpeg/SOURCE.txt "$t/ffmpeg/SOURCE.txt"
          $ver = & "$t/ffmpeg/bin/ffmpeg.exe" -hide_banner -version 2>&1 | Out-String
          $enc = & "$t/ffmpeg/bin/ffmpeg.exe" -hide_banner -encoders 2>&1 | Out-String
          New-Item -ItemType Directory -Force evidence | Out-Null
          $ver | Out-File evidence/ffmpeg-version.txt; $enc | Out-File evidence/ffmpeg-encoders.txt
          if ($ver -match '--enable-gpl' -or $ver -match '--enable-nonfree') { Write-Host "GPL/nonfree FFmpeg must not ship"; exit 1 }
          foreach ($e in 'h264_mf','libmp3lame','libopus','libwebp','aac','flac','gif') { "encoder $e present=$($enc -match "\b$e\b")" | Tee-Object -Append evidence/summary.txt }
          "ffmpeg bundle MB=$([math]::Round((Get-ChildItem "$t/ffmpeg" -Recurse | Measure-Object Length -Sum).Sum/1MB,1))" | Tee-Object -Append evidence/summary.txt
      - name: UI feature bisect
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          Get-ChildItem out/Orange -Recurse -Filter *.pri | ForEach-Object { "pri: $($_.FullName) $($_.Length)" } | Tee-Object -Append evidence/summary.txt
          foreach ($v in 'plain','bar','nav','combo','number','toggle','infobar','textbox','list','ring','orangebar','full') {
            $p = Start-Process out/Orange/Orange.exe -ArgumentList '--uitest', $v -PassThru
            if (-not $p.WaitForExit(20000)) { $p.Kill(); $code = 'timeout' } else { $code = $p.ExitCode }
            "uitest $v exit=$code" | Tee-Object -Append evidence/summary.txt
          }
      - name: Self-test (real Windows APIs, in-process)
        shell: pwsh
        env:
          ORANGE_FIXTURES: ${{ github.workspace }}\tests\fixtures
        run: |
          New-Item -ItemType Directory -Force evidence/selftest | Out-Null
          $env:ORANGE_TEST_EVENTS = "$PWD\evidence\selftest\events.log"
          $p = Start-Process out/Orange/Orange.exe -ArgumentList '--selftest', "$PWD\evidence\selftest" -PassThru -Wait
          Get-Content evidence/selftest/selftest.json -ErrorAction SilentlyContinue | Write-Host
          "selftest exit=$($p.ExitCode)" | Tee-Object -Append evidence/summary.txt
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in 'Application Error','.NET Runtime','Windows Error Reporting' } |
            Select-Object -First 12 | ForEach-Object { "[$($_.TimeCreated)] $($_.ProviderName)`n$($_.Message)`n" } | Out-File evidence/selftest/windows-events.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Real drag probe (SendInput + OLE + File Explorer)
        if: always()
        shell: pwsh
        run: |
          dotnet build tests/Orange.DragProbe -c Release -o out/probe 2>&1 | Out-File evidence/probe-build.log
          $p = Start-Process out/probe/Orange.DragProbe.exe -ArgumentList "$PWD\out\Orange\Orange.exe", "$PWD\tests\fixtures", "$PWD\evidence\probe" -PassThru -Wait
          Get-Content evidence/probe/probe.json -ErrorAction SilentlyContinue | Write-Host
          Copy-Item "$env:LOCALAPPDATA\Orange\crash.log" evidence/ -ErrorAction SilentlyContinue
          "probe exit=$($p.ExitCode)" | Tee-Object -Append evidence/summary.txt
      - name: Parse the laptop checklist script
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\tools\checklist\Run-OrangeChecklist.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs.Count) { $errs | ForEach-Object { Write-Host $_ }; exit 1 }
          "checklist script parses" | Tee-Object -Append evidence/summary.txt
      - name: Sign app, CLI, shell extension and MSIX (skipped without secrets)
        shell: pwsh
        run: |
          $r = & tools/sign/Sign-Files.ps1 out/Orange/Orange.exe out/Orange/orange-cli.exe out/Orange/OrangeShellExt.dll out/Orange/Orange-ContextMenu.msix
          $r | Tee-Object -Append evidence/summary.txt
          # The installer registers the sparse package only when it is signed (Windows refuses unsigned ones).
          if ("$r" -like 'signed=*') { New-Item out/Orange/contextmenu.signed -ItemType File -Force | Out-Null }
      - name: Package (portable zip + per-user installer)
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md, tools/checklist/Run-OrangeChecklist.ps1 out/Orange/ -ErrorAction SilentlyContinue
          Compress-Archive out/Orange/* out/Orange-0.2.0-win-x64-portable.zip -Force
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.2.0 installer/Orange.iss 2>&1 | Tee-Object evidence/installer.log
          Get-ChildItem out/*.zip, out/*.exe | Format-Table Name, Length | Out-String | Tee-Object -Append evidence/summary.txt
          $setup = Get-ChildItem out/Orange-*-setup.exe | Select-Object -First 1
          "installer MB=$([math]::Round($setup.Length/1MB,1)) (target < 90)" | Tee-Object -Append evidence/summary.txt
          Get-ChildItem out/Orange -Directory | ForEach-Object { "dir $($_.Name) MB=$([math]::Round((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum/1MB,1))" } | Tee-Object -Append evidence/summary.txt
          Get-ChildItem out/Orange -File | Sort-Object Length -Descending | Select-Object -First 15 | ForEach-Object { "file $($_.Name) MB=$([math]::Round($_.Length/1MB,1))" } | Tee-Object -Append evidence/summary.txt
          "root files MB=$([math]::Round((Get-ChildItem out/Orange -File | Measure-Object Length -Sum).Sum/1MB,1))" | Tee-Object -Append evidence/summary.txt
      - name: Sign the installer (skipped without secrets)
        shell: pwsh
        run: |
          & tools/sign/Sign-Files.ps1 (Get-ChildItem out/Orange-*-setup.exe).FullName | Tee-Object -Append evidence/summary.txt
      - name: Publish a release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = if (Test-Path CHANGELOG.md) { "See CHANGELOG.md" } else { "" }
          gh release create $tag -R ${{ github.repository }} --title "Orange $tag" --notes-file CHANGELOG.md (Get-ChildItem out/Orange-*-portable.zip).FullName (Get-ChildItem out/Orange-*-setup.exe).FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orange-win-x64
          path: |
            out/Orange-*-portable.zip
            out/Orange-*-setup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-evidence
          path: evidence
      - name: Publish evidence to ci-evidence branch
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = "evidence/app-build.log"
          if (Test-Path $log) { Select-String -Path $log -Pattern 'error|warn' | Select-Object -First 200 | ForEach-Object Line | Out-File evidence/app-build-errors.txt }
          Get-ChildItem evidence -Recurse -Directory | Where-Object { $_.Name -in 'work','a','explorer-source' } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          $repo = "$env:RUNNER_TEMP\evrepo"
          $url = "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 -b ci-evidence $url $repo 2>$null
          if (-not (Test-Path "$repo\.git")) { git init -q -b ci-evidence $repo; git -C $repo remote add origin $url }
          $dest = "$repo\run-${{ github.run_number }}"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item evidence\* $dest -Recurse -Force
          Get-ChildItem $dest -Recurse -Include *.log | Where-Object Length -gt 900KB | ForEach-Object { $t = Get-Content $_ -Tail 4000; Set-Content $_ $t }
          git -C $repo config user.name "orange-ci"; git -C $repo config user.email "orange-ci@users.noreply.github.com"
          git -C $repo add -A
          git -C $repo commit -qm "evidence for run ${{ github.run_number }} (${{ github.sha }})"
          git -C $repo push -q origin HEAD:ci-evidence
          if ($LASTEXITCODE -ne 0) { git -C $repo pull -q --rebase origin ci-evidence; git -C $repo push -q origin HEAD:ci-evidence }
      - name: Publish nightly pre-release (installer + portable)
        if: success() && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nightly -R ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create nightly -R ${{ github.repository }} --prerelease --title "Orange nightly" --notes "Unsigned development build from main. See README for what's verified." }
          gh release upload nightly -R ${{ github.repository }} (Get-ChildItem out/Orange-*-portable.zip).FullName (Get-ChildItem out/Orange-*-setup.exe).FullName --clobber
          gh release edit nightly -R ${{ github.repository }} --notes "Unsigned development build of ${{ github.sha }} (run ${{ github.run_number }}). Windows 10 1809+/11 x64. SmartScreen will warn because it's unsigned."
