name: Build Orange FFmpeg (small LGPL)
on:
  workflow_dispatch:
  push:
    paths: ['tools/ffmpeg/build-min.sh', '.github/workflows/build-ffmpeg.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64 nasm yasm meson ninja-build pkg-config autoconf automake libtool cmake >/dev/null
      - name: Build
        run: bash tools/ffmpeg/build-min.sh 2>&1 | tee build.log
      - name: Package
        run: |
          cd /tmp/out && zip -qr $GITHUB_WORKSPACE/ffmpeg-orange-win64.zip .
          sha256sum $GITHUB_WORKSPACE/ffmpeg-orange-win64.zip | tee $GITHUB_WORKSPACE/ffmpeg-orange-win64.sha256
          ls -la $GITHUB_WORKSPACE/ffmpeg-orange-win64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ffmpeg-orange, path: "ffmpeg-orange-win64.*\nbuild.log" }
      - name: Publish as release asset (tag ffmpeg-orange)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete ffmpeg-orange -R ${{ github.repository }} --yes --cleanup-tag 2>/dev/null || true
          gh release create ffmpeg-orange -R ${{ github.repository }} --prerelease --title "Orange FFmpeg build (LGPL)" \
            --notes "Built by tools/ffmpeg/build-min.sh from ffmpeg-7.1, LAME 3.100, Opus 1.5.2, libvpx 1.14.1, dav1d 1.4.3, zlib 1.3.1. LGPL-2.1+; source: the tarballs named in the script." \
            ffmpeg-orange-win64.zip ffmpeg-orange-win64.sha256
